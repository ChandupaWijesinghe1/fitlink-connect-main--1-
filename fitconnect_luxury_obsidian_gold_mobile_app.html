<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FitConnect • Obsidian & Gold Luxury Edition</title>
  
  <!-- Fonts: Playfair Display for Haute Luxury Headings, Plus Jakarta Sans for Ultra Crisp UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & Babel CDNs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  
  <!-- FontAwesome Icons for High Precision Gold Badges -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            obsidian: {
              950: '#060709',
              900: '#0A0C10',
              850: '#10131A',
              800: '#161922',
              700: '#202532',
            },
            champagne: {
              50: '#FFFDF5',
              100: '#FDF7E7',
              200: '#F8E9C4',
              300: '#F2D898',
              400: '#E7C269',
              500: '#D4AF37', // Master Champagne Gold
              600: '#B89128',
              700: '#94701B',
              800: '#6D5114',
              900: '#48350E',
            },
            bronze: {
              400: '#E0A885',
              500: '#C98A63',
              600: '#A46641',
            },
            platinum: '#B8B4A6',
            silversmoke: '#8E8A7E',
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          boxShadow: {
            'gold-glow': '0 0 25px rgba(212, 175, 55, 0.18)',
            'gold-glow-lg': '0 0 45px rgba(212, 175, 55, 0.28)',
            'gold-inner': 'inset 0 1px 1px rgba(255, 245, 215, 0.4)',
            'obsidian-depth': '0 20px 40px rgba(0,0,0,0.85)',
          },
          backgroundImage: {
            'gold-gradient': 'linear-gradient(135deg, #FBF4EC 0%, #E5C365 35%, #D4AF37 70%, #AA7C11 100%)',
            'gold-gradient-shine': 'linear-gradient(135deg, #FFF5D6 0%, #E5C365 40%, #B8860B 100%)',
            'gold-dark-card': 'linear-gradient(145deg, rgba(22, 25, 34, 0.95) 0%, rgba(10, 12, 16, 0.98) 100%)',
            'obsidian-glass': 'linear-gradient(135deg, rgba(26, 30, 42, 0.65) 0%, rgba(12, 14, 20, 0.75) 100%)',
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Luxury Styling & Animations */
    body {
      background-color: #050608;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #F8F9FA;
      overflow-x: hidden;
    }
    
    .gold-border {
      border: 1px solid rgba(212, 175, 55, 0.22);
    }

    .gold-border-glow {
      border: 1px solid rgba(212, 175, 55, 0.45);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
    }

    .gold-text-gradient {
      background: linear-gradient(135deg, #FFF6DD 0%, #F5E1A4 30%, #D4AF37 70%, #997316 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .silver-text-gradient {
      background: linear-gradient(135deg, #FFFFFF 0%, #E2E8F0 50%, #94A3B8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #0A0C10;
    }
    ::-webkit-scrollbar-thumb {
      background: #202532;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #D4AF37;
    }

    /* Glassmorphism backdrop */
    .glass-panel {
      background: rgba(16, 19, 26, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    
    .glass-header {
      background: rgba(10, 12, 16, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* Shimmer effect for buttons */
    @keyframes goldShimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    
    .btn-gold-shimmer {
      background: linear-gradient(90deg, #D4AF37 0%, #FDF7E7 35%, #D4AF37 70%, #94701B 100%);
      background-size: 200% 100%;
      animation: goldShimmer 4s infinite linear;
    }

    /* Dynamic Island notch */
    .dynamic-island {
      width: 120px;
      height: 28px;
      background-color: #000;
      border-radius: 20px;
      margin: 0 auto;
      transition: all 0.3s ease;
    }
  </style>
</head>
<body class="selection:bg-champagne-500 selection:text-black">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- MOCK DATABASE & SEED DATA ---
    const INITIAL_ROSTER = [
      { id: 'cl-1', name: 'Victoria Sterling', tier: 'Royal VIP Platinum', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80', status: 'Active', goal: 'Hypertrophy & Elegance', trainer: 'Alexander Vance', compliance: 98, lastActive: '10 min ago', metrics: { weight: 58.5, bodyFat: 18.2, streak: 14 } },
      { id: 'cl-2', name: 'Harrison Blake', tier: 'Private Elite', avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80', status: 'Active', goal: 'Peak Athletic Performance', trainer: 'Alexander Vance', compliance: 92, lastActive: '2 hrs ago', metrics: { weight: 84.2, bodyFat: 11.5, streak: 28 } },
      { id: 'cl-3', name: 'Seraphina Rothschild', tier: 'Royal VIP Platinum', avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150&auto=format&fit=crop&q=80', status: 'Pending Review', goal: 'Postural Sculpting', trainer: 'Alexander Vance', compliance: 85, lastActive: 'Yesterday', metrics: { weight: 54.0, bodyFat: 20.1, streak: 6 } },
      { id: 'cl-4', name: 'Julian Kingsford', tier: 'Private Elite', avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150&auto=format&fit=crop&q=80', status: 'Active', goal: 'Endurance & Mobility', trainer: 'Elena Rostova', compliance: 95, lastActive: '3 hrs ago', metrics: { weight: 77.0, bodyFat: 13.8, streak: 19 } },
    ];

    const INITIAL_EXERCISES = [
      { id: 'ex-1', title: 'Barbell Romanian Deadlift', target: 'Posterior Chain & Glutes', level: 'Master', equipment: 'Olympic Barbell', muscleGroup: 'Legs', videoUrl: 'https://assets.mixkit.co/videos/preview/mixkit-man-training-in-a-gym-42654-large.mp4', notes: 'Maintain pristine neutral spine, slow 3-sec eccentric lowering.' },
      { id: 'ex-2', title: 'Incline Dumbbell Chest Press', target: 'Upper Pectorals & Deltoids', level: 'Advanced', equipment: 'Dumbbells & Incline Bench', muscleGroup: 'Chest', videoUrl: '', notes: 'Slight outward arc at contraction peak.' },
      { id: 'ex-3', title: 'Champagne Cable Flyes', target: 'Inner Pectoral Squeeze', level: 'Intermediate', equipment: 'Dual Adjustable Pulley', muscleGroup: 'Chest', videoUrl: '', notes: 'Focus on maximum tension at center line.' },
      { id: 'ex-4', title: 'Bulgarian Split Squat', target: 'Quadriceps & Core Stability', level: 'Advanced', equipment: 'Bench & Kettlebells', muscleGroup: 'Legs', videoUrl: '', notes: 'Keep torso vertical to emphasize quad engagement.' },
      { id: 'ex-5', title: 'Weighted Neutral Pull-ups', target: 'Latissimus Dorsi & Biceps', level: 'Master', equipment: 'Pull-up Bar & Dip Belt', muscleGroup: 'Back', videoUrl: '', notes: 'Pause 1 second at top chin position.' },
    ];

    const INITIAL_MESSAGES = [
      { id: 'm1', sender: 'trainer', text: 'Good morning, Victoria. Your customized leg hypertrophy program has been updated for today.', time: '08:30 AM', isAudio: false },
      { id: 'm2', sender: 'client', text: 'Thank you Alexander! Loved the RDL cue yesterday. Feeling great strength gains.', time: '08:34 AM', isAudio: false },
      { id: 'm3', sender: 'trainer', text: 'Audio note: Focus on hip hinge control during set 3.', time: '08:40 AM', isAudio: true, duration: '0:28' },
    ];

    const INITIAL_NOTIFICATIONS = [
      { id: 'n1', title: 'Session Confirmed', desc: 'Alexander Vance accepted your 5:30 PM Private Coaching Session.', time: '10m ago', read: false, icon: 'fa-calendar-check' },
      { id: 'n2', title: 'New Plan Delivered', desc: 'Obsidian Hypertrophy Phase II is now live in your workout tab.', time: '2h ago', read: false, icon: 'fa-dumbbell' },
      { id: 'n3', title: 'Weekly Assessment Due', desc: 'Upload your progress photos and body metrics for review.', time: '1d ago', read: true, icon: 'fa-chart-line' },
    ];

    // Main Master App Component
    function App() {
      // Navigation Routing state
      const [currentRoute, setCurrentRoute] = useState('/dashboard');
      const [routeParam, setRouteParam] = useState(null);
      
      // Device Shell Mode: Mobile Frame vs Full Browser View
      const [isMobileFrame, setIsMobileFrame] = useState(true);
      const [isDevSwitcherOpen, setIsDevSwitcherOpen] = useState(false);

      // App Global State
      const [userRole, setUserRole] = useState('client'); // 'client' or 'trainer'
      const [clients, setClients] = useState(INITIAL_ROSTER);
      const [exercises, setExercises] = useState(INITIAL_EXERCISES);
      const [messages, setMessages] = useState(INITIAL_MESSAGES);
      const [notifications, setNotifications] = useState(INITIAL_NOTIFICATIONS);
      
      // UI Modals / Overlays
      const [activeLiveWorkout, setActiveLiveWorkout] = useState(null);
      const [isExerciseModalOpen, setIsExerciseModalOpen] = useState(false);
      const [selectedExerciseForEdit, setSelectedExerciseForEdit] = useState(null);
      const [isScheduleModalOpen, setIsScheduleModalOpen] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      // Toast Banner Helper
      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      // Custom Navigation Handler
      const navigateTo = (path, param = null) => {
        setCurrentRoute(path);
        setRouteParam(param);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      // Available routes list for quick Dev Bar Switcher
      const ALL_ROUTES = [
        { path: '/', label: '1. Client Login', role: 'client' },
        { path: '/signup', label: '2. Client Signup', role: 'client' },
        { path: '/trainer/login', label: '3. Trainer Login', role: 'trainer' },
        { path: '/trainer/signup', label: '4. Trainer Signup', role: 'trainer' },
        { path: '404', label: '5. 404 Error Screen', role: 'any' },
        { path: '/dashboard', label: '6. Client Dashboard / Feed', role: 'client' },
        { path: '/messages', label: '7. Client Chat Concierge', role: 'client' },
        { path: '/notifications', label: '8. Client Notifications', role: 'client' },
        { path: '/profile', label: '9. Client Profile & VIP Tier', role: 'client' },
        { path: '/progress', label: '10. Client Metrics & Analytics', role: 'client' },
        { path: '/trainer/dashboard', label: '11. Trainer Executive Hub', role: 'trainer' },
        { path: '/trainer/messages', label: '12. Trainer Chat & Plan Dispatch', role: 'trainer' },
        { path: '/trainer/notifications', label: '13. Trainer Connection Alerts', role: 'trainer' },
        { path: '/trainer/me', label: '14. Trainer Studio Showcase', role: 'trainer' },
        { path: '/trainer/gym', label: '15. Connected Clients Roster', role: 'trainer' },
        { path: '/trainer/clients/cl-1/progress', label: '16. Client Progress Deep Dive', role: 'trainer', param: 'cl-1' },
        { path: '/exercises/manage', label: '17. Luxury Exercise Vault', role: 'any' },
      ];

      // Auto update role when route changes
      useEffect(() => {
        if (currentRoute.startsWith('/trainer') && currentRoute !== '/trainer/login' && currentRoute !== '/trainer/signup') {
          setUserRole('trainer');
        } else if (!currentRoute.startsWith('/trainer') && currentRoute !== '/' && currentRoute !== '/signup' && currentRoute !== '404') {
          setUserRole('client');
        }
      }, [currentRoute]);

      return (
        <div className="min-h-screen bg-obsidian-950 text-gray-100 flex flex-col items-center justify-start antialiased relative">
          
          {/* DEV TOOLBAR SWITCHER (HEADER OVERLAY) */}
          <div className="w-full bg-obsidian-900 border-b border-champagne-500/20 text-xs py-2 px-4 flex flex-wrap items-center justify-between z-50 sticky top-0 shadow-2xl">
            <div className="flex items-center space-x-3">
              <span className="flex items-center space-x-1.5 font-bold tracking-widest text-champagne-400">
                <i className="fa-solid fa-gem text-champagne-400"></i>
                <span className="uppercase font-serif">FitConnect VIP</span>
              </span>
              <span className="hidden sm:inline text-obsidian-700">|</span>
              <span className="hidden sm:inline text-gray-400">Current View: <strong className="text-champagne-300 font-mono">{currentRoute}</strong></span>
            </div>

            <div className="flex items-center space-x-2">
              <button 
                onClick={() => setIsMobileFrame(!isMobileFrame)}
                className="px-2.5 py-1 rounded-md bg-obsidian-800 hover:bg-obsidian-700 border border-champagne-500/30 text-champagne-300 transition-all flex items-center space-x-1.5 text-xs"
                title="Toggle Phone Frame View"
              >
                <i className={`fa-solid ${isMobileFrame ? 'fa-expand' : 'fa-mobile-screen-button'}`}></i>
                <span className="hidden md:inline">{isMobileFrame ? 'Full Viewport' : 'Mobile Frame'}</span>
              </button>

              <div className="relative">
                <button 
                  onClick={() => setIsDevSwitcherOpen(!isDevSwitcherOpen)}
                  className="px-3 py-1 rounded-md bg-gradient-to-r from-champagne-500 to-champagne-700 text-obsidian-950 font-bold hover:brightness-110 transition-all flex items-center space-x-1.5 shadow-gold-glow"
                >
                  <span>17 Routes Switcher</span>
                  <i className={`fa-solid fa-chevron-${isDevSwitcherOpen ? 'up' : 'down'} text-[10px]`}></i>
                </button>

                {isDevSwitcherOpen && (
                  <div className="absolute right-0 mt-2 w-72 max-h-96 overflow-y-auto bg-obsidian-900 border border-champagne-500/40 rounded-xl shadow-obsidian-depth p-2 z-50 backdrop-blur-xl">
                    <div className="text-[10px] uppercase font-bold text-champagne-400 tracking-wider px-2 py-1 border-b border-obsidian-800 mb-1">
                      Select Page / Route (1-17)
                    </div>
                    {ALL_ROUTES.map((r, idx) => (
                      <button
                        key={idx}
                        onClick={() => {
                          navigateTo(r.path, r.param);
                          setIsDevSwitcherOpen(false);
                        }}
                        className={`w-full text-left px-2.5 py-1.5 rounded-lg transition-colors flex items-center justify-between text-xs my-0.5 ${
                          currentRoute === r.path 
                            ? 'bg-champagne-500/20 text-champagne-300 font-bold border border-champagne-500/30' 
                            : 'hover:bg-obsidian-800 text-gray-300'
                        }`}
                      >
                        <span className="truncate">{r.label}</span>
                        <span className={`text-[9px] px-1.5 py-0.5 rounded font-mono ${r.role === 'trainer' ? 'bg-amber-950 text-amber-400 border border-amber-500/30' : r.role === 'client' ? 'bg-blue-950 text-blue-300 border border-blue-500/30' : 'bg-gray-800 text-gray-400'}`}>
                          {r.role}
                        </span>
                      </button>
                    ))}
                  </div>
                )}
              </div>
            </div>
          </div>

          {/* TOAST BANNER OVERLAY */}
          {toastMessage && (
            <div className="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-obsidian-900/95 border border-champagne-500/60 text-champagne-200 px-6 py-3 rounded-full shadow-gold-glow-lg flex items-center space-x-3 text-xs backdrop-blur-md animate-bounce">
              <i className="fa-solid fa-circle-check text-champagne-400 text-base"></i>
              <span className="font-medium tracking-wide">{toastMessage}</span>
            </div>
          )}

          {/* MAIN DISPLAY CONTAINER (Frame vs Full View) */}
          <main className={`w-full transition-all duration-300 flex justify-center py-0 md:py-6 ${isMobileFrame ? 'max-w-md' : 'max-w-4xl'}`}>
            <div className={`w-full bg-obsidian-900 border-x border-champagne-500/20 flex flex-col min-h-[850px] relative overflow-hidden transition-all duration-300 ${isMobileFrame ? 'rounded-[40px] shadow-obsidian-depth border-y border-champagne-500/30 my-2' : 'rounded-2xl'}`}>
              
              {/* MOBILE STATUS BAR & DYNAMIC ISLAND (Only visible in frame mode or mobile view) */}
              <div className="bg-obsidian-950/90 backdrop-blur-md pt-3 pb-2 px-6 flex items-center justify-between text-xs text-gray-400 border-b border-obsidian-800/50 select-none z-40">
                <span className="font-semibold text-champagne-200">9:41</span>
                
                {/* Dynamic Island */}
                <div className="dynamic-island flex items-center justify-center space-x-2 px-3 text-[10px] text-champagne-400 font-mono">
                  <span className="w-2 h-2 rounded-full bg-champagne-400 animate-pulse"></span>
                  <span className="truncate max-w-[80px]">FitConnect</span>
                </div>

                <div className="flex items-center space-x-2 text-[11px] text-gray-300">
                  <i className="fa-solid fa-signal"></i>
                  <i className="fa-solid fa-wifi"></i>
                  <i className="fa-solid fa-battery-full text-champagne-400"></i>
                </div>
              </div>

              {/* ROUTE CONTROLLER RENDERER */}
              <div className="flex-1 flex flex-col pb-20 relative overflow-y-auto">
                {renderCurrentRoute(currentRoute, {
                  navigateTo,
                  routeParam,
                  setUserRole,
                  userRole,
                  clients,
                  setClients,
                  exercises,
                  setExercises,
                  messages,
                  setMessages,
                  notifications,
                  setNotifications,
                  triggerToast,
                  setActiveLiveWorkout,
                  setIsExerciseModalOpen,
                  setSelectedExerciseForEdit,
                  setIsScheduleModalOpen
                })}
              </div>

              {/* BOTTOM NAVIGATION BAR (Visible on logged-in app routes) */}
              {showBottomNav(currentRoute) && (
                <div className="absolute bottom-0 left-0 right-0 glass-header border-t border-champagne-500/20 py-2.5 px-4 flex items-center justify-around z-40">
                  {userRole === 'client' ? (
                    <>
                      <NavTab active={currentRoute === '/dashboard'} icon="fa-house" label="Feed" onClick={() => navigateTo('/dashboard')} />
                      <NavTab active={currentRoute === '/progress'} icon="fa-chart-line" label="Progress" onClick={() => navigateTo('/progress')} />
                      <NavTab active={currentRoute === '/exercises/manage'} icon="fa-dumbbell" label="Vault" onClick={() => navigateTo('/exercises/manage')} />
                      <NavTab active={currentRoute === '/messages'} icon="fa-paper-plane" label="Chat" badge={messages.length} onClick={() => navigateTo('/messages')} />
                      <NavTab active={currentRoute === '/profile'} icon="fa-user-gear" label="VIP Settings" onClick={() => navigateTo('/profile')} />
                    </>
                  ) : (
                    <>
                      <NavTab active={currentRoute === '/trainer/dashboard'} icon="fa-chart-pie" label="Executive Hub" onClick={() => navigateTo('/trainer/dashboard')} />
                      <NavTab active={currentRoute === '/trainer/gym'} icon="fa-users" label="Clients" onClick={() => navigateTo('/trainer/gym')} />
                      <NavTab active={currentRoute === '/exercises/manage'} icon="fa-dumbbell" label="Exercises" onClick={() => navigateTo('/exercises/manage')} />
                      <NavTab active={currentRoute === '/trainer/messages'} icon="fa-comments" label="Client Chat" onClick={() => navigateTo('/trainer/messages')} />
                      <NavTab active={currentRoute === '/trainer/me'} icon="fa-gem" label="Studio" onClick={() => navigateTo('/trainer/me')} />
                    </>
                  )}
                </div>
              )}

              {/* IPHONE HOME INDICATOR BAR */}
              <div className="w-36 h-1 bg-champagne-500/40 rounded-full mx-auto my-1.5 z-40"></div>
            </div>
          </main>

          {/* OVERLAY MODAL: LIVE WORKOUT MODE */}
          {activeLiveWorkout && (
            <LiveWorkoutModal 
              session={activeLiveWorkout} 
              onClose={() => setActiveLiveWorkout(null)} 
              onFinish={() => {
                setActiveLiveWorkout(null);
                triggerToast('Workout Session Logged Successfully! +250 VIP Points');
              }}
            />
          )}

          {/* OVERLAY MODAL: ADD / EDIT EXERCISE */}
          {isExerciseModalOpen && (
            <ExerciseManageModal 
              exercise={selectedExerciseForEdit} 
              onClose={() => {
                setIsExerciseModalOpen(false);
                setSelectedExerciseForEdit(null);
              }}
              onSave={(newEx) => {
                if (selectedExerciseForEdit) {
                  setExercises(exercises.map(e => e.id === newEx.id ? newEx : e));
                  triggerToast('Movement definition updated');
                } else {
                  setExercises([newEx, ...exercises]);
                  triggerToast('New movement added to Vault');
                }
                setIsExerciseModalOpen(false);
                setSelectedExerciseForEdit(null);
              }}
            />
          )}

          {/* OVERLAY MODAL: SCHEDULE SESSION */}
          {isScheduleModalOpen && (
            <ScheduleSessionModal 
              onClose={() => setIsScheduleModalOpen(false)}
              onConfirm={(details) => {
                setIsScheduleModalOpen(false);
                triggerToast(`Private Session booked for ${details.date} at ${details.time}`);
              }}
            />
          )}

        </div>
      );
    }

    // Helper to determine bottom nav visibility
    function showBottomNav(route) {
      const authRoutes = ['/', '/signup', '/trainer/login', '/trainer/signup', '404'];
      return !authRoutes.includes(route);
    }

    // Nav Tab Button Component
    function NavTab({ active, icon, label, badge, onClick }) {
      return (
        <button 
          onClick={onClick}
          className={`flex flex-col items-center justify-center relative py-1 px-2 rounded-xl transition-all duration-200 ${
            active ? 'text-champagne-400 scale-105' : 'text-gray-400 hover:text-gray-200'
          }`}
        >
          <div className="relative">
            <i className={`fa-solid ${icon} text-lg mb-0.5 ${active ? 'gold-text-gradient' : ''}`}></i>
            {badge > 0 && (
              <span className="absolute -top-1.5 -right-2 bg-gradient-to-r from-champagne-400 to-champagne-600 text-obsidian-950 font-extrabold text-[9px] w-4 h-4 rounded-full flex items-center justify-center border border-obsidian-950">
                {badge}
              </span>
            )}
          </div>
          <span className={`text-[10px] font-medium tracking-tight ${active ? 'text-champagne-300 font-bold' : ''}`}>
            {label}
          </span>
          {active && <span className="w-1.5 h-1.5 rounded-full bg-champagne-400 mt-0.5 shadow-gold-glow"></span>}
        </button>
      );
    }

    // --- ROUTE SWITCHING ENGINE (ROUTER) ---
    function renderCurrentRoute(route, props) {
      switch(route) {
        // Auth Routes
        case '/':
          return <ClientLoginScreen {...props} />;
        case '/signup':
          return <ClientSignupScreen {...props} />;
        case '/trainer/login':
          return <TrainerLoginScreen {...props} />;
        case '/trainer/signup':

                key={g}
                onClick={() => setFilterGroup(g)}
                className={`px-3 py-1.5 rounded-full text-xs font-medium transition-all ${
                  filterGroup === g ? 'bg-champagne-500/20 text-champagne-300 border border-champagne-500' : 'bg-obsidian-850 text-gray-400 border border-obsidian-800'
                }`}
              >
                {g}
              </button>
            ))}
          </div>

          {/* EXERCISES LIST */}
          <div className="space-y-3">
            {filtered.map(ex => (
              <div key={ex.id} className="bg-obsidian-850 border gold-border rounded-2xl p-4 flex flex-col justify-between space-y-3">
                <div className="flex justify-between items-start">
                  <div>
                    <span className="text-[9px] font-bold uppercase tracking-widest text-champagne-400">{ex.muscleGroup} • {ex.level}</span>
                    <h4 className="font-serif font-bold text-sm text-white mt-0.5">{ex.title}</h4>
                    <p className="text-xs text-gray-400 mt-1">{ex.target}</p>
                  </div>
                  <button 
                    onClick={() => {
                      setSelectedExerciseForEdit(ex);
                      setIsExerciseModalOpen(true);
                    }}
                    className="text-gray-400 hover:text-champagne-400 text-xs p-1"
                  >
                    <i className="fa-solid fa-pen-to-square"></i>
                  </button>
                </div>
                {ex.notes && <p className="text-[11px] text-gray-500 italic border-t border-obsidian-800 pt-2">{ex.notes}</p>}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ==========================================
    // OVERLAY MODAL COMPONENTS
    // ==========================================

    // Live Workout Mode Modal
    function LiveWorkoutModal({ session, onClose, onFinish }) {
      const [currentSet, setCurrentSet] = useState(1);
      const [timer, setTimer] = useState(45);

      useEffect(() => {
        const interval = setInterval(() => {
          setTimer(t => (t > 0 ? t - 1 : 45));
        }, 1000);
        return () => clearInterval(interval);
      }, []);

      return (
        <div className="fixed inset-0 z-50 bg-obsidian-950/90 backdrop-blur-xl flex flex-col p-6 animate-fadeIn">
          <div className="flex justify-between items-center pb-4 border-b border-champagne-500/20">
            <div>
              <span className="text-[10px] font-bold uppercase tracking-widest text-champagne-400">Live Session Active</span>
              <h3 className="font-serif text-lg font-bold text-white">{session.title}</h3>
            </div>
            <button onClick={onClose} className="w-8 h-8 rounded-full bg-obsidian-800 text-gray-400 hover:text-white">
              <i className="fa-solid fa-xmark"></i>
            </button>
          </div>

          <div className="flex-1 flex flex-col items-center justify-center space-y-8 my-auto">
            <div className="w-40 h-40 rounded-full border-4 border-champagne-500/30 border-t-champagne-400 flex flex-col items-center justify-center shadow-gold-glow-lg">
              <span className="text-xs uppercase font-bold text-champagne-400 tracking-widest">Rest Timer</span>
              <span className="text-4xl font-mono font-bold gold-text-gradient">{timer}s</span>
            </div>

            <div className="text-center space-y-2">
              <span className="text-xs text-gray-400 uppercase tracking-widest">Target Movement</span>
              <h2 className="font-serif text-2xl font-bold text-white">Barbell Romanian Deadlift</h2>
              <div className="flex justify-center space-x-3 text-sm font-mono text-champagne-300">
                <span>Set {currentSet} of 4</span>
                <span>•</span>
                <span>100 kg</span>
                <span>•</span>
                <span>8 Reps</span>
              </div>
            </div>

            <button 
              onClick={() => {
                if (currentSet < 4) {
                  setCurrentSet(currentSet + 1);
                } else {
                  onFinish();
                }
              }}
              className="w-full max-w-xs py-4 rounded-2xl btn-gold-shimmer text-obsidian-950 font-bold uppercase tracking-widest text-xs shadow-gold-glow"
            >
              {currentSet < 4 ? `Complete Set ${currentSet}` : 'Finish Workout Session'}
            </button>
          </div>
        </div>
      );
    }

    // Exercise Edit/Add Modal
    function ExerciseManageModal({ exercise, onClose, onSave }) {
      const [title, setTitle] = useState(exercise ? exercise.title : '');
      const [muscleGroup, setMuscleGroup] = useState(exercise ? exercise.muscleGroup : 'Legs');
      const [notes, setNotes] = useState(exercise ? exercise.notes : '');

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({
          id: exercise ? exercise.id : `ex-${Date.now()}`,
          title,
          muscleGroup,
          level: 'Advanced',
          target: 'Custom Movement Pattern',
          notes,
        });
      };

      return (
        <div className="fixed inset-0 z-50 bg-obsidian-950/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="w-full max-w-sm bg-obsidian-900 border gold-border rounded-3xl p-6 space-y-4 shadow-obsidian-depth">
            <h3 className="font-serif text-lg font-bold text-white">{exercise ? 'Edit Movement' : 'Add Movement to Vault'}</h3>
            
            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-[10px] font-bold text-champagne-400 uppercase tracking-widest mb-1">Exercise Title</label>
                <input 
                  type="text" 
                  value={title} 
                  onChange={(e) => setTitle(e.target.value)} 
                  required
                  className="w-full bg-obsidian-850 border border-obsidian-700 rounded-xl p-3 text-xs text-white"
                />
              </div>

              <div>
                <label className="block text-[10px] font-bold text-champagne-400 uppercase tracking-widest mb-1">Primary Muscle Group</label>
                <select 
                  value={muscleGroup} 
                  onChange={(e) => setMuscleGroup(e.target.value)}
                  className="w-full bg-obsidian-850 border border-obsidian-700 rounded-xl p-3 text-xs text-white"
                >
                  <option>Legs</option>
                  <option>Chest</option>
                  <option>Back</option>
                  <option>Shoulders</option>
                  <option>Arms</option>
                </select>
              </div>

              <div>
                <label className="block text-[10px] font-bold text-champagne-400 uppercase tracking-widest mb-1">Form Cues & Notes</label>
                <textarea 
                  value={notes} 
                  onChange={(e) => setNotes(e.target.value)} 
                  className="w-full bg-obsidian-850 border border-obsidian-700 rounded-xl p-3 text-xs text-white h-20"
                />
              </div>

              <div className="flex space-x-2 pt-2">
                <button type="button" onClick={onClose} className="flex-1 py-3 rounded-xl bg-obsidian-800 text-gray-400 text-xs font-bold">Cancel</button>
                <button type="submit" className="flex-1 py-3 rounded-xl btn-gold-shimmer text-obsidian-950 text-xs font-bold uppercase">Save</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Schedule Session Modal
    function ScheduleSessionModal({ onClose, onConfirm }) {
      const [date, setDate] = useState('2026-11-25');
      const [time, setTime] = useState('17:30');

      return (
        <div className="fixed inset-0 z-50 bg-obsidian-950/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="w-full max-w-sm bg-obsidian-900 border gold-border rounded-3xl p-6 space-y-4 shadow-obsidian-depth">
            <h3 className="font-serif text-lg font-bold text-white">Schedule VIP Concierge Session</h3>
            <div className="space-y-3 text-xs">
              <div>
                <label className="block text-[10px] font-bold text-champagne-400 uppercase tracking-widest mb-1">Date</label>
                <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="w-full bg-obsidian-850 border border-obsidian-700 rounded-xl p-3 text-white" />
              </div>
              <div>
                <label className="block text-[10px] font-bold text-champagne-400 uppercase tracking-widest mb-1">Preferred Time Slot</label>
                <input type="time" value={time} onChange={(e) => setTime(e.target.value)} className="w-full bg-obsidian-850 border border-obsidian-700 rounded-xl p-3 text-white" />
              </div>
            </div>

            <div className="flex space-x-2 pt-2">
              <button onClick={onClose} className="flex-1 py-3 rounded-xl bg-obsidian-800 text-gray-400 text-xs font-bold">Cancel</button>
              <button onClick={() => onConfirm({ date, time })} className="flex-1 py-3 rounded-xl btn-gold-shimmer text-obsidian-950 text-xs font-bold uppercase">Confirm Booking</button>
            </div>
          </div>
        </div>
      );
    }

    // Mount App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
